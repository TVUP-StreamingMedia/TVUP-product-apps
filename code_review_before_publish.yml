# publicar.yml — Revisión al PUBLICAR (no en cada sync de AI Studio).
#
# AI Studio sincroniza a main continuamente mientras Producto itera. Eso NO
# dispara nada. La revisión corre solo cuando alguien decide publicar a
# producción, pulsando este workflow a mano.
#
# Cómo se lanza: repo en GitHub → pestaña Actions → "Publicar a producción"
# → botón "Run workflow". Es un solo click, deliberado.

name: Publicar a producción

on:
  workflow_dispatch:        # ← disparo MANUAL, no automático
    inputs:
      motivo:
        description: "Motivo o versión que se publica (opcional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisión de seguridad antes de publicar
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Eres el revisor de TVUP. Esta app está a punto de PUBLICARSE a
            producción. Revisa el ESTADO ACTUAL del código (lo que va a salir),
            no un diff. Sé directo y conciso.

            PASO 1 — Calibra por tier. Lee GEMINI.md, busca "Perfil de esta app"
            y su TIER DE INTAKE:
            - N0: revisión ligera, solo problemas claros de seguridad.
            - N1: revisión estándar.
            - N2: revisión estricta; cualquier duda es bloqueante y esta app
              requería aprobación de Ingeniería/Seguridad.
            Si no hay GEMINI.md ni perfil, asume N2 (lo más estricto).

            PASO 2 — Revisa contra las reglas de seguridad de TVUP:
            1. Ninguna credencial en el código (API keys, tokens, service
               accounts). Todo server-side o como secreto.
            2. Firestore: nunca 'if true'; mínimo request.auth != null; datos
               por usuario aislados por request.auth.uid.
            3. Si maneja datos: Firebase Auth con proveedor Microsoft (M365),
               restringido al tenant y verificado en backend.
            4. Validación de entrada; inyección; sin dangerouslySetInnerHTML.
            5. Sin CORS abierto en endpoints con datos; sin endpoints de debug.
            6. Sin datos sensibles en logs; sin persistir en el disco efímero.

            PASO 3 — Veredicto final, en una línea:
            "APTO PARA PUBLICAR" o "NO PUBLICAR: <motivos>".
            Si hay algo Crítico o Alto, es NO PUBLICAR.
          claude_args: |
            --max-turns 15

      # Paso siguiente (opcional, cuando quieras encadenar el deploy):
      # tras una revisión APTA, disparar el deploy a producción, que a su vez
      # pasa por el gate de aprobación de Cloud Build (Capa 4).
      # Se deja comentado hasta validar la revisión en el piloto.
      #
      # - name: Desplegar a producción (con gate de aprobación)
      #   run: gcloud builds submit --config cloudbuild.yaml
