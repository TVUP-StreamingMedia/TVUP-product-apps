on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Caso A: Pull Request → comentarios en línea sobre el diff ──
      - name: Revisión del PR (comentarios en línea)
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
          prompt: |
            Eres el revisor técnico automático de TVUP. Revisa SOLO el diff de
            este PR. Publica tus hallazgos como comentarios en línea sobre las
            líneas concretas del código.

            PASO 1 — Calibra según el tier. Lee GEMINI.md o CLAUDE.md, sección
            "Perfil de esta app" (TIER DE INTAKE). N0: ligera. N1: estándar.
            N2: estricta, cualquier duda es bloqueante. Sin perfil: asume N2.

            PASO 2 — Revisa contra las reglas de TVUP. Para cada hallazgo:
            severidad (Crítica/Alta/Media/Baja) y corrección recomendada.
            - Implementación: diseño, manejo de errores, rendimiento, bugs de
              lógica (sobre todo en cálculos con dinero o datos reales).
            - Seguridad: sin credenciales en el código; Firestore nunca
              'if true' y mínimo request.auth != null; login Microsoft 365
              restringido al tenant si maneja datos; validación de entrada y
              sin dangerouslySetInnerHTML; sin CORS abierto ni endpoints de
              debug; sin datos sensibles en logs; .gitignore con .env*; pnpm.

            PASO 3 — Termina el resumen con "RIESGO GLOBAL: <Bajo|Medio|Alto|Crítico>".

      # ── Caso B: disparo manual → informe completo ──
      - name: Revisión manual (informe completo)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
          prompt: |
            Eres el revisor técnico automático de TVUP. No hay Pull Request:
            revisa el ESTADO COMPLETO del código del repositorio.

            PASO 1 — Calibra según el tier. Lee GEMINI.md o CLAUDE.md, sección
            "Perfil de esta app" (TIER DE INTAKE). N0: ligera. N1: estándar.
            N2: estricta, cualquier duda es bloqueante y la app requería
            aprobación de Ingeniería/Seguridad. Sin perfil: asume N2.

            PASO 2 — Revisa contra las reglas de TVUP. Para cada hallazgo:
            archivo:línea, severidad (Crítica/Alta/Media/Baja) y corrección
            recomendada, con el fragmento de código si aporta claridad.
            - Implementación: diseño, manejo de errores, rendimiento, bugs de
              lógica (sobre todo en cálculos con dinero o datos reales).
            - Seguridad: sin credenciales en el código; Firestore nunca
              'if true' y mínimo request.auth != null; login Microsoft 365
              restringido al tenant si maneja datos; validación de entrada y
              sin dangerouslySetInnerHTML; sin CORS abierto ni endpoints de
              debug; sin datos sensibles en logs; .gitignore con .env*; pnpm.

            PASO 3 — Entrega el informe COMPLETO como tu respuesta final, en
            Markdown. NO escribas ningún archivo: tu respuesta final se
            guardará automáticamente como informe. Estructura:
            - Encabezado con el tier aplicado.
            - Una sección por hallazgo: severidad, archivo:línea, descripción
              y corrección propuesta.
            - Sección final "Instrucciones para corregir", redactada como un
              prompt listo para pegar en Claude Code o Google AI Studio.
            - Última línea: "RIESGO GLOBAL: <Bajo|Medio|Alto|Crítico>".

      - name: Extraer el informe
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          FILE="${{ steps.manual.outputs.execution_file }}"
          [ -f "$FILE" ] || FILE="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$FILE" ]; then
            echo "No se encontró el resultado de la ejecución."
            exit 0
          fi
          jq -r 'if type=="array"
                 then (map(select(.type=="result")) | last | .result)
                 else .result end' "$FILE" > INFORME-REVISION.md
          echo "Informe generado ($(wc -l < INFORME-REVISION.md) líneas)"
          # Resumen visible directamente en la página de la ejecución
          cat INFORME-REVISION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe como artifact
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: informe-revision
          path: INFORME-REVISION.md
          if-no-files-found: warn
