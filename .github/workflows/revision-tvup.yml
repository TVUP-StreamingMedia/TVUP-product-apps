on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Caso A: evento de Pull Request → comentarios en línea sobre el diff ──
      - name: Revisión del PR (comentarios en línea)
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Eres el revisor técnico automático de TVUP. Revisa SOLO el diff de
            este PR, no todo el repositorio. Publica tus hallazgos como
            comentarios en línea sobre las líneas concretas del código.

            PASO 1 — Calibra según el tier de la app.
            Lee GEMINI.md o CLAUDE.md, busca "Perfil de esta app" (TIER DE
            INTAKE). N0: revisión ligera. N1: estándar. N2: estricta, cualquier
            duda es bloqueante. Sin archivo de reglas ni perfil: asume N2.

            PASO 2 — Revisa contra las reglas de TVUP.
            Para cada hallazgo: severidad (Crítica/Alta/Media/Baja) y la
            corrección recomendada.

            === Implementación técnica ===
            Diseño, legibilidad, manejo de errores, rendimiento evidente,
            bugs de lógica (especialmente en cálculos con dinero o datos reales).

            === Seguridad TVUP (obligatorio) ===
            1. Ninguna credencial en el código (API keys, tokens, service
               accounts). Server-side o como secreto, nunca en el repo.
            2. Firestore: prohibido 'allow read, write: if true'. Mínimo
               request.auth != null; datos por usuario aislados por uid.
            3. Si maneja datos: Firebase Auth con proveedor Microsoft (M365),
               restringido al tenant y verificado en backend.
            4. Validación de entrada; inyección; sin dangerouslySetInnerHTML.
            5. Sin CORS abierto en endpoints con datos; sin endpoints de debug.
            6. Sin datos sensibles en logs; sin persistir en disco efímero.
            7. .gitignore presente con .env*.
            8. pnpm como gestor de paquetes (pnpm-lock.yaml).

            PASO 3 — Veredicto.
            Termina el resumen del PR con: "RIESGO GLOBAL: <Bajo|Medio|Alto|Crítico>".
            Si es Alto o Crítico, indica que no debe fusionarse sin corregir.
          claude_args: |
            --max-turns 30

      # ── Caso B: disparo manual (sin PR) → informe completo en archivo ──
      - name: Revisión manual (informe completo)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Eres el revisor técnico automático de TVUP. No hay Pull Request:
            revisa el ESTADO COMPLETO del código del repositorio.

            PASO 1 — Calibra según el tier de la app.
            Lee GEMINI.md o CLAUDE.md, busca "Perfil de esta app" (TIER DE
            INTAKE). N0: revisión ligera. N1: estándar. N2: estricta, cualquier
            duda es bloqueante y recuerda que esta app requería aprobación de
            Ingeniería/Seguridad. Sin archivo de reglas ni perfil: asume N2.

            PASO 2 — Revisa contra las reglas de TVUP.
            Para cada hallazgo: archivo:línea, severidad (Crítica/Alta/Media/Baja)
            y la corrección recomendada, con el fragmento de código a cambiar
            si aporta claridad.

            === Implementación técnica ===
            Diseño, legibilidad, manejo de errores, rendimiento evidente,
            bugs de lógica (especialmente en cálculos con dinero o datos reales).

            === Seguridad TVUP (obligatorio) ===
            1. Ninguna credencial en el código (API keys, tokens, service
               accounts). Server-side o como secreto, nunca en el repo.
            2. Firestore: prohibido 'allow read, write: if true'. Mínimo
               request.auth != null; datos por usuario aislados por uid.
            3. Si maneja datos: Firebase Auth con proveedor Microsoft (M365),
               restringido al tenant y verificado en backend.
            4. Validación de entrada; inyección; sin dangerouslySetInnerHTML.
            5. Sin CORS abierto en endpoints con datos; sin endpoints de debug.
            6. Sin datos sensibles en logs; sin persistir en disco efímero.
            7. .gitignore presente con .env*.
            8. pnpm como gestor de paquetes (pnpm-lock.yaml).

            PASO 3 — Escribe el informe en un archivo.
            Vuelca TODO el análisis (no un resumen) en un archivo Markdown en
            la raíz del repositorio llamado INFORME-REVISION.md, con:
            - Encabezado con la fecha y el tier aplicado.
            - Una sección por hallazgo, con severidad, ubicación, descripción
              y corrección propuesta.
            - Una sección final "Instrucciones para corregir" redactada como
              un prompt listo para pegar en Claude Code o Google AI Studio.
            - Al final, una sola línea: "RIESGO GLOBAL: <Bajo|Medio|Alto|Crítico>".
            Usa la herramienta de escritura de archivos para crear el archivo
            de verdad; no te limites a describirlo en tu respuesta.
          claude_args: |
            --max-turns 40

      - name: Diagnóstico — localizar el informe
        if: always()
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "--- Archivos .md en todo el workspace ---"
          find "$GITHUB_WORKSPACE" -iname "*.md" -newer /tmp 2>/dev/null || true
          echo "--- Por si acaso, búsqueda global en /home/runner ---"
          find /home/runner -iname "INFORME-REVISION.md" 2>/dev/null || true
          echo "--- Contenido de la raíz del repo ---"
          ls -la "$GITHUB_WORKSPACE"

      - name: Guardar el informe como artifact (si existe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-revision
          path: |
            ${{ github.workspace }}/INFORME-REVISION.md
            INFORME-REVISION.md
          if-no-files-found: ignore
